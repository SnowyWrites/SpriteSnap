[package]
name = "SpriteSnap"
version = "1.0.0"
edition = "2024"

[dependencies]
fltk = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = "2"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
