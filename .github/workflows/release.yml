name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # lets you run it by hand from the Actions tab to test

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Rename
        shell: pwsh
        run: Copy-Item target/release/SpriteSnap.exe SpriteSnap-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SpriteSnap-windows-x64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev
      - run: cargo build --release
      - name: Build AppImage
        env:
          DEPLOY_GTK_VERSION: 3
        run: |
          cat > spritesnap.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SpriteSnap
          Exec=SpriteSnap
          Icon=icon
          Categories=Graphics;
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/48x48/apps
          cp src/assets/icon.png AppDir/usr/share/icons/hicolor/48x48/apps/icon.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/SpriteSnap \
            --desktop-file spritesnap.desktop \
            --plugin gtk \
            --output appimage
          mv SpriteSnap*.AppImage SpriteSnap-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: SpriteSnap-linux-x86_64.AppImage

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
